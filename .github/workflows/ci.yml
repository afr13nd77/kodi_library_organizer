name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: pip install -r requirements.txt
      - run: python -m pytest shared/tests/ script.library.organizer/tests/ -v --cov=shared --cov=script.library.organizer/python --cov-report=term-missing

  build:
    name: Build ZIP
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: '*.zip'
          retention-days: 90

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python build_zip.py
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
